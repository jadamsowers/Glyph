name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: Test engine
        run: swift test
      - name: Build app
        run: xcodebuild -project App/Glyph.xcodeproj -scheme Glyph -configuration Release -derivedDataPath App/build -destination 'generic/platform=macOS' -quiet build
