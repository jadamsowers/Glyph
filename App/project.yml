name: Glyph
options:
  bundleIdPrefix: co.jadam
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  VectorEngine:
    path: ..
targets:
  Glyph:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [Sources, Resources]
    dependencies:
      - package: VectorEngine
        product: VectorEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.jadam.glyph
        PRODUCT_NAME: Glyph
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glyph
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        # Uses no encryption of its own, so App Store Connect skips the export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The sandbox is macOS-only; iOS asks only for extra memory headroom for large photos.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Glyph.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Glyph-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Glyph-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Glyph traces photos you take into vector art.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
