name: Glyph
options:
  bundleIdPrefix: com.jadam
  deploymentTarget:
    macOS: "14.0"
packages:
  VectorEngine:
    path: ..
targets:
  Glyph:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: VectorEngine
        product: VectorEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jadam.Glyph
        PRODUCT_NAME: Glyph
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glyph
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        CODE_SIGN_ENTITLEMENTS: Glyph.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
